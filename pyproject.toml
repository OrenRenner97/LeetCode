[project]
name = "leetcode-plus"
version = "0.1.0"
description = "Алгоритмы с LeetCode как библиотека + бизнес-модули поверх неё"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]"]
fast = ["numpy", "numba"]
gpu = ["cupy-cuda13x[ctk]"]

[dependency-groups]
dev = ["pytest", "hypothesis", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algos", "src/biz", "src/interfaces"]

[tool.pytest.ini_options]
testpaths = ["tests", "problems"]
addopts = "-q --import-mode=importlib"
